name: Refresh jobs

on:
  schedule:
    - cron: "7 * * * *"        # hourly
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet fastapi httpx pyyaml python-dotenv python-multipart

      - name: Pull jobs from every source
        env:
          # Optional. Add these under Settings > Secrets and variables > Actions.
          # Without them the free sources still work; with them India coverage jumps.
          ADZUNA_APP_ID:  ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY:   ${{ secrets.RAPIDAPI_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: python -m backend.ingest

      - name: Pull approved community submissions
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m backend.supabase_sync pull

      - name: Mirror listings to Supabase for the All-jobs view
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m backend.supabase_sync push

      - name: Tally community verifications from the issue tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m backend.flags

      - name: Build the static bundle
        run: python -m backend.export_static

      # Committing the data is a convenience, not the point of the run. A transient
      # GitHub 500 here must never stop the site from deploying, so this step retries
      # and then gives up quietly.
      - name: Commit the refreshed data
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/jobs.json site/data/companies.json site/data/flags.json
          git diff --staged --quiet && { echo "no data changes"; exit 0; }
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push failed (attempt $attempt), refetching..."
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 10))
          done
          echo "::warning::could not commit refreshed data; deploying anyway"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
